<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Termix" />
    <link rel="apple-touch-icon" href="icons/512x512.png" />
    <link rel="manifest" href="manifest.json" />
    <title>termix</title>
    <style>
      .hide-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .skinny-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #2f2f2f #000000;
      }

      .skinny-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      .skinny-scrollbar::-webkit-scrollbar-track {
        background: #000000;
      }

      .skinny-scrollbar::-webkit-scrollbar-thumb {
        background-color: #2f2f2f;
        border-radius: 3px;
        border: 1px solid #000000;
      }

      .toolbar-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #2f2f2f transparent;
      }

      .toolbar-scrollbar::-webkit-scrollbar {
        height: 3px;
      }

      .toolbar-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }

      .toolbar-scrollbar::-webkit-scrollbar-thumb {
        background-color: #2f2f2f;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <script>
      window.__TERMIX_BASE_PATH__ = "";
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
