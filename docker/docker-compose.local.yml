name: termix

services:
  termix:
    image: termix:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: termix
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - termix-data:/app/data
    environment:
      PORT: "8080"
      ENABLE_SSL: "true"
      SSL_PORT: "8443"
      SSL_DOMAIN: "termix.ncls.cc"
      GUACD_HOST: "termix-guacd"
      GUACD_TUNNEL_HOST: "termix"
      GUACD_RECORDING_PATH: "/termix-data/session_recordings/guacamole"
      ENABLE_TELEMETRY: "false"
      ALLOW_REGISTRATION: "false"
      PUID: "1001"
      PGID: "1001"
    depends_on:
      - termix-guacd
    networks:
      - termix-net

  termix-guacd:
    image: guacamole/guacd:1.6.0
    container_name: termix-guacd
    restart: unless-stopped
    volumes:
      - termix-data:/termix-data
    networks:
      - termix-net

volumes:
  termix-data:
    external: true
    name: termix-data

networks:
  termix-net:
    driver: bridge
    name: termix-net
