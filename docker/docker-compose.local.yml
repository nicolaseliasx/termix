name: tserver

services:
  tserver:
    image: tserver:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: termix
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - tserver-data:/app/data
    environment:
      PORT: "8080"
      ENABLE_SSL: "true"
      SSL_PORT: "8443"
      SSL_DOMAIN: "tserver.ncls.cc"
      GUACD_HOST: "tserver-guacd"
      GUACD_TUNNEL_HOST: "tserver"
      GUACD_RECORDING_PATH: "/tserver-data/session_recordings/guacamole"
      ENABLE_TELEMETRY: "false"
      ALLOW_REGISTRATION: "false"
      PUID: "1001"
      PGID: "1001"
    depends_on:
      - tserver-guacd
    networks:
      - tserver-net

  tserver-guacd:
    image: guacamole/guacd:1.6.0
    container_name: tserver-guacd
    restart: unless-stopped
    volumes:
      - tserver-data:/tserver-data
    networks:
      - tserver-net

volumes:
  tserver-data:
    driver: local
    name: tserver-data

networks:
  tserver-net:
    driver: bridge
    name: tserver-net
